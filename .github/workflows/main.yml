name: "unit tests"

on:
  push:
  pull_request:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
    - uses: actions/checkout@v4

    - name: configure
      run: cmake -S . -B build -DUNIT_TEST=ON    

    - name: build
      run: cmake --build build --target adt_unit

    - name: test
      run: ctest --test-dir build --output-on-failure
